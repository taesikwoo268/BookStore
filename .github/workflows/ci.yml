name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # ============================================================
      # MYSQL
      # ============================================================
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 3636
          MYSQL_DATABASE: bookstore
          MYSQL_USER: bookstore_user
          MYSQL_PASSWORD: 3636
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p3636"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
          --health-start-period=30s

      # ============================================================
      # REDIS
      # ============================================================
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -a redis123 ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

      # ============================================================
      # RABBITMQ
      # ============================================================
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ============================================================
      # ✅ WAIT FOR MYSQL - Dùng sleep 30
      # ============================================================
      - name: Wait for MySQL
        run: |
          echo "⏳ Waiting for MySQL to start..."
          sleep 30
          echo "✅ MySQL ready (after 30s sleep)"

      # ============================================================
      # ✅ WAIT FOR REDIS - Dùng sleep 15
      # ============================================================
      - name: Wait for Redis
        run: |
          echo "⏳ Waiting for Redis to start..."
          sleep 15
          echo "✅ Redis ready (after 15s sleep)"

      # ============================================================
      # ✅ WAIT FOR RABBITMQ - Dùng sleep 20
      # ============================================================
      - name: Wait for RabbitMQ
        run: |
          echo "⏳ Waiting for RabbitMQ to start..."
          sleep 20
          echo "✅ RabbitMQ ready (after 20s sleep)"

      # ============================================================
      # 🔍 DEBUG - Kiểm tra services đã sẵn sàng
      # ============================================================
      - name: Debug - Verify services
        run: |
          echo "🔍 Verifying services..."
          echo ""
          echo "📦 Docker containers:"
          docker ps -a
          echo ""
          echo "📦 MySQL:"
          mysqladmin ping -h localhost -uroot -p3636 --silent && echo "✅ MySQL OK" || echo "⚠️ MySQL not responding"
          echo ""
          echo "📦 Redis:"
          redis-cli -h localhost -a redis123 ping 2>/dev/null && echo "✅ Redis OK" || echo "⚠️ Redis not responding"
          echo ""
          echo "📦 RabbitMQ:"
          curl -s -u admin:admin123 http://localhost:15672/api/health/checks/alarms | head -5

      # ============================================================
      # RUN TESTS
      # ============================================================
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: mvn clean test jacoco:report

      # ============================================================
      # UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Generate JaCoCo Badge
        id: jacoco
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            COVERAGE=$(grep -o '<tfoot>.*</tfoot>' target/site/jacoco/index.html | grep -o '[0-9]\+%' | head -1 || echo "0%")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=0%" >> $GITHUB_OUTPUT
          fi

      - name: Comment coverage on PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const coverage = '${{ steps.jacoco.outputs.coverage }}';
            const reportLink = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts`;
            
            let status = '';
            const covNum = parseInt(coverage);
            if (covNum >= 80) {
              status = '✅ **Great job! Coverage is above 80%**';
            } else if (covNum >= 70) {
              status = '⚠️ **Good! Consider adding more tests to reach 80%**';
            } else {
              status = '❌ **Coverage is below 70%. Please add more tests!**';
            }
            
            const message = `## 📊 JaCoCo Code Coverage Report\n\n` +
              `| Metric | Value |\n` +
              `|--------|-------|\n` +
              `| **Coverage** | **${coverage}** |\n` +
              `| **CI Run** | [View details](${reportLink}) |\n\n` +
              `### 📈 Coverage Status\n` +
              `${status}\n\n` +
              `> 📝 *Automatically generated*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });