name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 3636
          MYSQL_DATABASE: bookstore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p3636"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ===== 1. Checkout code =====
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 2. Setup Java =====
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ===== 3. Cache Maven dependencies =====
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ===== 4. Wait for services =====
      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h localhost -uroot -p3636 --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Wait for Redis
        run: |
          while ! redis-cli -h localhost ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      # ===== 5. Run tests =====
      - name: Run tests with coverage
        run: mvn clean test jacoco:report

      # ===== 6. Generate JaCoCo report =====
      - name: Generate JaCoCo Badge
        id: jacoco
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            # Extract coverage percentage
            COVERAGE=$(grep -o '<tfoot>.*</tfoot>' target/site/jacoco/index.html | grep -o '[0-9]\+%' | head -1 || echo "0%")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "Coverage: $COVERAGE"
          else
            echo "coverage=0%" >> $GITHUB_OUTPUT
            echo "Coverage report not found"
          fi

      # ===== 7. Upload JaCoCo report as artifact =====
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # ===== 8. Comment coverage on PR =====
      - name: Comment coverage on PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const coverage = '${{ steps.jacoco.outputs.coverage }}';
            const reportLink = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts`;
            
            const message = `## 📊 JaCoCo Code Coverage Report
            
            | Metric | Value |
            |--------|-------|
            | **Coverage** | **${coverage}** |
            | **CI Run** | [View details](${reportLink}) |
            
            ### 📈 Coverage Status
            ${
              coverage !== '0%' && parseInt(coverage) >= 80 
                ? '✅ **Great job! Coverage is above 80%**'
                : coverage !== '0%' && parseInt(coverage) >= 70
                ? '⚠️ **Good! Consider adding more tests to reach 80%**'
                : '❌ **Coverage is below 70%. Please add more tests!**'
            }
            
            > 📝 *This comment is automatically generated by GitHub Actions*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      # ===== 9. Upload test results =====
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/