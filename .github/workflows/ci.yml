# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 3636
          MYSQL_DATABASE: bookstore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p3636"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin123
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # ===== Wait for services =====
      - name: Wait for MySQL
        run: |
          echo "⏳ Waiting for MySQL to start..."
          sleep 40
          echo "✅ MySQL ready (assumed after 40s)"

      - name: Wait for Redis
        run: |
          echo "⏳ Waiting for Redis..."
          for i in {1..20}; do
            if redis-cli -h localhost ping 2>/dev/null | grep -q PONG; then
              echo "✅ Redis is ready!"
              exit 0
            fi
            echo "⏳ Waiting for Redis... ($i/20)"
            sleep 2
          done
          echo "❌ Redis failed to start"
          exit 1

      - name: Wait for RabbitMQ
        run: |
          echo "⏳ Waiting for RabbitMQ..."
          for i in {1..20}; do
            if curl -s -u admin:admin123 http://localhost:15672/api/health/checks/alarms 2>/dev/null | grep -q '"status":"ok"'; then
              echo "✅ RabbitMQ is ready!"
              exit 0
            fi
            echo "⏳ Waiting for RabbitMQ... ($i/20)"
            sleep 3
          done
          echo "❌ RabbitMQ failed to start"
          exit 1

      # ===== Debug =====
      - name: Debug - Show services
        run: |
          echo "🔍 Checking services..."
          echo ""
          echo "📦 Docker containers:"
          docker ps -a
          echo ""
          echo "📦 MySQL:"
          mysqladmin ping -h localhost -uroot -p3636 --silent && echo "✅ MySQL is running" || echo "❌ MySQL not running"
          echo ""
          echo "📦 Redis:"
          redis-cli -h localhost ping && echo "✅ Redis is running" || echo "❌ Redis not running"
          echo ""
          echo "📦 RabbitMQ:"
          curl -s -u admin:admin123 http://localhost:15672/api/health/checks/alarms | head -20

      # ===== Run tests =====
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: mvn clean test jacoco:report

      # ===== Upload artifacts =====
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # ===== Coverage comment =====
      - name: Generate JaCoCo Badge
        id: jacoco
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            COVERAGE=$(grep -o '<tfoot>.*</tfoot>' target/site/jacoco/index.html | grep -o '[0-9]\+%' | head -1 || echo "0%")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
            echo "📊 Coverage: $COVERAGE"
          else
            echo "coverage=0%" >> $GITHUB_OUTPUT
            echo "⚠️ Coverage report not found"
          fi

      - name: Comment coverage on PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const coverage = '${{ steps.jacoco.outputs.coverage }}';
            const reportLink = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts`;
            
            let status = '';
            const covNum = parseInt(coverage);
            if (covNum >= 80) {
              status = '✅ **Great job! Coverage is above 80%**';
            } else if (covNum >= 70) {
              status = '⚠️ **Good! Consider adding more tests to reach 80%**';
            } else {
              status = '❌ **Coverage is below 70%. Please add more tests!**';
            }
            
            const message = `## 📊 JaCoCo Code Coverage Report\n\n` +
              `| Metric | Value |\n` +
              `|--------|-------|\n` +
              `| **Coverage** | **${coverage}** |\n` +
              `| **CI Run** | [View details](${reportLink}) |\n\n` +
              `### 📈 Coverage Status\n` +
              `${status}\n\n` +
              `> 📝 *This comment is automatically generated by GitHub Actions*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });