# Redis configuration file
# ============================================================

# Network
bind 0.0.0.0
port 6379

# Security - Chỉ dùng cho development
requirepass redis123

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
timeout 0