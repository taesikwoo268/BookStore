# =====================================================
# DATABASE CONFIG
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3308/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=3636

# Hibernate:
spring.jpa.hibernate.ddl-auto=none

# =====================================================
# HIBERNATE CONFIG
# =====================================================

# Hien thi SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Log SQL parameters
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Log statistics
logging.level.org.hibernate.stat=DEBUG
spring.jpa.properties.hibernate.generate_statistics=false
# Log N+1 detection
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=DEBUG

# =====================================================
# HIKARICP CONFIG
# =====================================================

spring.datasource.hikari.pool-name=BookStoreHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000


# =====================================================
# FLYWAY CONFIG
# =====================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# Log debug
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# =====================================================
# SWAGGER CONFIG
# =====================================================

# OpenAPI Documentation
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Packages to scan
springdoc.packages-to-scan=com.bookstore.controller

# Paths to include
springdoc.paths-to-match=/api/**,/api/v1/**

# Show actuator endpoints
springdoc.show-actuator=false

# Logging configuration
logging.level.com.bookstore=DEBUG
logging.level.com.bookstore.aspect=DEBUG
logging.level.com.bookstore.service=INFO
logging.level.org.springframework=WARN

# Pattern cho log output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n
logging.pattern.level=%-5level

# Log AOP
logging.level.org.springframework.aop=DEBUG

# =====================================================
# JWT CONFIG
# =====================================================
app.jwt.secret=bookstoreSecretKey123456789012345678901234567890123456789012345678901234567890

app.jwt.private-key-path=classpath:keys/private_key.pem
app.jwt.public-key-path=classpath:keys/public_key.pem

# Access token expiration: 1 hour (3600000 milliseconds)
app.jwt.access-token-expiration=3600000
# Refresh token expiration: 7 days (604800000 milliseconds)
app.jwt.refresh-token-expiration=604800000

# ============================================================
# REDIS CONFIG
# ============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.data.redis.timeout=5000ms

# Lettuce pool
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# ============================================================
# CACHE CONFIG
# ============================================================
spring.cache.type=redis
spring.cache.redis.time-to-live=600000  # 10 phút (default)
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=bookstore:
spring.cache.redis.use-key-prefix=true

# ============================================================
# RABBITMQ CONFIG
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/
spring.rabbitmq.connection-timeout=5000ms