# ============================================================
# DOCKER PROFILE
# ============================================================

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://mysql:3308/bookstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=3636
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=redis123
spring.data.redis.timeout=5000ms

# RabbitMQ
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123
spring.rabbitmq.virtual-host=/

# Logging
logging.level.com.bookstore=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.rabbit.enabled=true

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000